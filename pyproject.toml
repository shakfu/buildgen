[project]
name = "buildgen"
version = "0.1.12"
description = "Build system generator - Makefile, CMake, scikit-build-core and more."
readme = "README.md"
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mako>=1.3.12",
    "pyyaml>=6.0.3",
]
keywords = [
    "makefile",
    "cmake",
    "build-system",
    "code-generation",
    "cpp",
    "c++",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/shakfu/buildgen"
Repository = "https://github.com/shakfu/buildgen"
Issues = "https://github.com/shakfu/buildgen/issues"
Changelog = "https://github.com/shakfu/buildgen/blob/main/CHANGELOG.md"

[project.scripts]
buildgen = "buildgen.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.135.0",
    "mypy>=1.19.1",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
    "twine>=7.0.0",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildgen"]

[tool.hatch.build.targets.sdist]
include = [
    "src/buildgen",
    "tests",
    "scripts",
    "Makefile",
    "README.md",
    "CHANGELOG.md",
    "TODO.md",
    "LICENSE",
]

[tool.mypy]
disable_error_code = ["import-untyped"]
ignore_missing_imports = true


